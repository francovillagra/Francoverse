<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0d1117">
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>
  <!-- Alert bars (simulated activity) -->
  <rect x="60" y="280" width="8" height="60" fill="#fb8500" opacity="0.7"/>
  <rect x="80" y="300" width="8" height="40" fill="#d29922" opacity="0.7"/>
  <rect x="100" y="260" width="8" height="80" fill="#f85149" opacity="0.9"/>
  <rect x="120" y="290" width="8" height="50" fill="#fb8500" opacity="0.7"/>
  <rect x="140" y="310" width="8" height="30" fill="#d29922" opacity="0.6"/>
  <rect x="160" y="270" width="8" height="70" fill="#f85149" opacity="0.8"/>
  <rect x="180" y="295" width="8" height="45" fill="#fb8500" opacity="0.7"/>
  <rect x="200" y="305" width="8" height="35" fill="#d29922" opacity="0.6"/>
  <rect x="220" y="255" width="8" height="85" fill="#f85149" opacity="0.9"/>
  <rect x="240" y="285" width="8" height="55" fill="#58a6ff" opacity="0.5"/>
  <!-- Shield icon -->
  <path d="M 580 120 L 620 135 L 620 175 Q 620 210 580 225 Q 540 210 540 175 L 540 135 Z"
        fill="none" stroke="#58a6ff" stroke-width="2.5" opacity="0.9"/>
  <path d="M 565 175 L 575 185 L 598 162"
        fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Title -->
  <text x="400" y="185" font-family="ui-monospace, monospace" font-size="42"
        font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="-1">log-sentinel</text>
  <!-- Subtitle -->
  <text x="400" y="225" font-family="ui-monospace, monospace" font-size="16"
        fill="#8b949e" text-anchor="middle" letter-spacing="1">real-time security log monitoring</text>
  <!-- Live indicator -->
  <circle cx="305" cy="270" r="5" fill="#3fb950"/>
  <text x="318" y="275" font-family="ui-monospace, monospace" font-size="13"
        fill="#3fb950">LIVE</text>
  <!-- Severity badges -->
  <rect x="200" y="300" width="80" height="22" rx="3" fill="#f8514920"/>
  <text x="240" y="315" font-family="ui-monospace, monospace" font-size="11"
        fill="#f85149" text-anchor="middle">HIGH</text>
  <rect x="292" y="300" width="90" height="22" rx="3" fill="#d2992220"/>
  <text x="337" y="315" font-family="ui-monospace, monospace" font-size="11"
        fill="#d29922" text-anchor="middle">MEDIUM</text>
  <rect x="394" y="300" width="80" height="22" rx="3" fill="#58a6ff20"/>
  <text x="434" y="315" font-family="ui-monospace, monospace" font-size="11"
        fill="#58a6ff" text-anchor="middle">LOW</text>
</svg>
